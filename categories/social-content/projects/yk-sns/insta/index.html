<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영칼로리포케 Instagram Highlights</title>
    <link rel="stylesheet" href="./highlight.css" />
  </head>
  <body>
    <main class="instagram">
      <section class="profile" aria-label="영칼로리포케 인스타그램 프로필">
        <img
          class="profile-logo"
          src="images/profile-logo.png"
          alt="영칼로리포케 로고"
        />
        <div>
          <div class="profile-title">
            <h1>youngkcal__official</h1>
            <span>•••</span>
          </div>
          <p class="profile-name">영칼로리 포케</p>
          <div class="stats">
            <div>게시물 <span>147</span></div>
            <div>팔로워 <span>1037</span></div>
            <div>팔로우 <span>20</span></div>
          </div>
          <p class="bio">
            💪 TREND + HEALTH = YOUNGKCAL<br />📍 매장 · 대전 본점, 강남 학동,
            판교 외 37곳<br />⬇️ 영칼 홈페이지 &amp; 가맹문의 ⬇️<br /><span
              class="link"
              >linktr.ee/youngkcal</span
            >
          </p>
        </div>
      </section>

      <div class="actions" aria-hidden="true">
        <button class="follow" type="button">팔로우</button>
        <button type="button">메시지 보내기</button>
        <button type="button">♙</button>
      </div>

      <ul
        class="highlights"
        id="highlightList"
        role="tablist"
        aria-label="스토리 하이라이트"
      ></ul>

      <section class="story-section" aria-live="polite">
        <div class="story-heading">
          <h2 id="storyTitle">포케</h2>
        </div>
        <div class="story-stack" id="storyStack"></div>
      </section>
      <!-- 카드뉴스 피드 -->
      <section class="feed-section">
        <nav class="feed-tabs" aria-label="콘텐츠 분류">
          <button class="feed-tab is-active" type="button" data-filter="all">
            <img src="images/tab-grid.png" alt="전체 게시물" />
          </button>

          <button class="feed-tab" type="button" data-filter="video">
            <img src="images/tab-card.png" alt="video" />
          </button>

          <button class="feed-tab" type="button" data-filter="event">
            <img src="images/tab-event.png" alt="이벤트" />
          </button>

          <button class="feed-tab" type="button" data-filter="brand">
            <img src="images/tab-brand.png" alt="브랜드 소식" />
          </button>
        </nav>

        <div class="feed-grid" id="feedGrid"></div>
      </section>

      <!-- 카드뉴스 팝업 -->
      <div class="post-modal" id="postModal" aria-hidden="true">
        <div class="post-modal-backdrop" data-modal-close></div>

        <article
          class="post-modal-content"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modalTitle"
        >
          <button
            class="modal-close"
            type="button"
            data-modal-close
            aria-label="팝업 닫기"
          >
            ×
          </button>

          <!-- 왼쪽 카드뉴스 -->
          <section class="modal-media">
            <img id="modalImage" src="" alt="" />
            <video
              id="modalVideo"
              controls
              playsinline
              preload="metadata"
              hidden
            ></video>

            <button
              class="slide-button slide-prev"
              id="slidePrev"
              type="button"
              aria-label="이전 이미지"
            >
              ‹
            </button>

            <button
              class="slide-button slide-next"
              id="slideNext"
              type="button"
              aria-label="다음 이미지"
            >
              ›
            </button>

            <div class="slide-count" id="slideCount"></div>
          </section>

          <!-- 오른쪽 게시물 정보 -->
          <section class="modal-info">
            <header class="modal-profile">
              <img
                class="modal-profile-image"
                src="images/profile-logo.png"
                alt="영칼로리포케"
              />

              <strong>youngkcal__official</strong>
              <span>·</span>
              <span class="follow-text">팔로우</span>
            </header>

            <div class="modal-description">
              <h2 id="modalTitle"></h2>
              <p id="modalIntent"></p>
            </div>

            <footer class="modal-actions">
              <div class="modal-action-left">
                <button type="button" aria-label="좋아요">
                  <img src="images/icon-heart.png" alt="" />
                </button>

                <button type="button" aria-label="댓글">
                  <img src="images/icon-comment.png" alt="" />
                </button>

                <button type="button" aria-label="공유">
                  <img src="images/icon-share.png" alt="" />
                </button>
              </div>
              <button type="button" aria-label="저장">
                <img src="images/icon-save.png" alt="" />
              </button>
            </footer>
          </section>
        </article>
      </div>
    </main>
    <script src="./data.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
