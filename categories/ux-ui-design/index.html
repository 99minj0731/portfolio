<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="김민정 브랜드 디자이너 — UX/UI 디자인" />
    <title>UX/UI Design — 김민정</title>
    <link rel="stylesheet" href="style.css" />

  <body>
    <header class="site-header">
      <a class="logo" href="../../index.html" aria-label="홈으로 이동">MJ</a>

    <main class="category-page">
      <section class="category-hero">
        <p class="eyebrow">05 / 06</p>

        <iframe
          id="project-frame"
          class="project-frame"
          src="projects/Edu/index.html"

          scrolling="no"
        ></iframe>
        <button class="top-button" type="button" aria-label="맨 위로 이동">

    <script src="script.js"></script>
