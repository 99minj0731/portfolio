<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>컵 홀더 디자인</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="project-detail">
      <section class="project-hero">
        <h1>컵 홀더 디자인</h1>
        <p class="project-desc">
          브랜드 인지도를 강조한 테이크아웃 컵홀더 디자인입니다.
        </p>
      </section>
      <div class="project-info-tool">
        <div>
          <strong>Tool</strong>
          <div class="tool-icons">
            <img src="../../../../images/ai.png" />
          </div>
        </div>
      </div>

      <section class="project-info">
        <div>
          <strong>Role</strong>
          <p>Package Design</p>
        </div>
        <div>
          <strong>Year</strong>
          <p>2026.05</p>
        </div>
        <div>
          <strong>Context</strong>
          <p>구오컴퍼니</p>
        </div>
      </section>

      <section class="project-section">
        <div class="section-title">
          <h2>Design</h2>
        </div>
        <p>
          브랜드 톤을 반영해 어두운 그린 계열을 메인 컬러로 적용했습니다.<br />
          중앙에는 로고를 크게 배치해 멀리서도 브랜드가 명확하게 보이도록
          가시성을 확보했습니다.<br />
          상단에는 영칼로리포케의 메인 카피를 배치해 브랜드 메시지를 함께
          전달했으며, 한쪽에는 수상 내역을 정리해 브랜드 신뢰도를 높였습니다.
        </p>

        <div class="project-images">
          <img src="./images/cup_mockup.png" />
        </div>
      </section>

      <section class="project-section">
        <div class="section-title">
          <h2>Print Data</h2>
        </div>

        <div class="process-list">
          <img
            style="width: 500px; max-width: 100%; height: auto"
            src="./images/컵홀더_인쇄데이터.png"
          />
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
